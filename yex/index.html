<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yex Executor</title>

    <link rel="icon" type="image/png" href="/assets/Yex.png">
    <link rel="shortcut icon" type="image/png" href="/assets/Yex.png">

    <!-- Discord / OG embed -->
    <meta property="og:type"        content="website">
    <meta property="og:url"         content="https://yesd3v.github.io/yex">
    <meta property="og:title"       content="Yex Executor">
    <meta property="og:description" content="Download Yex Executor&#10;Free Roblox executor by yes.dev">
    <meta property="og:image"       content="https://yesd3v.github.io/assets/Yex.png">
    <meta property="og:image:width"  content="512">
    <meta property="og:image:height" content="512">

    <!-- Twitter card (Discord also reads these as fallback) -->
    <meta name="twitter:card"        content="summary">
    <meta name="twitter:title"       content="Yex Executor">
    <meta name="twitter:description" content="Download Yex Executor&#10;Free Roblox executor by yes.dev">
    <meta name="twitter:image"       content="https://yesd3v.github.io/assets/Yex.png">

    <!-- Plain meta description -->
    <meta name="description" content="Download Yex Executor. Free Roblox executor by yes.dev">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            width: 100%;
            scroll-behavior: smooth;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 255, 255, 0.055),
                    transparent 38%
                ),
                #000;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.38;
            background:
                linear-gradient(135deg, transparent 47%, rgba(255,255,255,.025) 49%, transparent 51%),
                linear-gradient(45deg,  transparent 47%, rgba(255,255,255,.018) 49%, transparent 51%);
            background-size: 130px 130px;
            transform: perspective(800px) rotateX(55deg) scale(1.7);
            transform-origin: center bottom;
        }

        .floor {
            position: fixed;
            left: -10%;
            right: -10%;
            bottom: -35%;
            height: 75%;
            z-index: -1;
            opacity: 0.34;
            pointer-events: none;
            transform: perspective(500px) rotateX(62deg);
            background:
                linear-gradient(rgba(255,255,255,.105) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.105) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: linear-gradient(to top, #000, transparent);
            -webkit-mask-image: linear-gradient(to top, #000, transparent);
        }

        /* ── Back button ─────────────────────────────────────────── */

        .back {
            position: fixed;
            top: 24px;
            left: 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,.5);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em;
            transition: color .2s ease;
            z-index: 10;
        }

        .back:hover {
            color: rgba(255,255,255,.9);
        }

        .back svg {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        /* ── Center card ─────────────────────────────────────────── */

        .card {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 32px;
            padding: 56px 64px;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 24px;
            box-shadow:
                inset 0 1px rgba(255,255,255,.03),
                0 30px 80px rgba(0,0,0,.55);
            text-align: center;
        }

        /* ── Logo ────────────────────────────────────────────────── */

        .logo-wrap {
            width: 96px;
            height: 96px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: rgba(0,0,0,.45);
            border: 1px solid rgba(255,255,255,.10);
        }

        .logo-wrap img {
            width: 58px;
            height: 58px;
            object-fit: contain;
        }

        /* ── Text ────────────────────────────────────────────────── */

        .card-title {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: .04em;
            line-height: 1;
            color: #fff;
            text-shadow:
                0 0 6px rgba(255,255,255,.5),
                0 0 20px rgba(255,255,255,.18);
        }

        .card-sub {
            margin-top: 8px;
            font-size: 13px;
            color: rgba(255,255,255,.35);
            font-weight: 600;
            letter-spacing: .02em;
        }

        /* ── Download counter ────────────────────────────────────── */

        .dl-counter {
            position: absolute;
            top: 20px;
            left: 22px;
            display: flex;
            align-items: center;
            gap: 7px;
            color: rgba(255,255,255,.28);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .04em;
            user-select: none;
        }

        .dl-counter svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ── Download button ─────────────────────────────────────── */

        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            color: #000;
            text-decoration: none;
            background: #fff;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .04em;
            cursor: pointer;
            transition:
                background .2s ease,
                box-shadow .2s ease,
                transform .15s ease;
            box-shadow: 0 0 28px rgba(255,255,255,.18);
        }

        .dl-btn:hover {
            background: #e8e8e8;
            box-shadow: 0 0 40px rgba(255,255,255,.28);
            transform: translateY(-2px);
        }

        .dl-btn:active {
            transform: translateY(0);
        }

        .dl-btn svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
        }

        /* ── Version / meta ──────────────────────────────────────── */

        .meta {
            font-size: 11px;
            color: rgba(255,255,255,.2);
            font-weight: 600;
            letter-spacing: .05em;
        }

        /* ── Mobile ──────────────────────────────────────────────── */

        @media (max-width: 500px) {
            .card {
                padding: 40px 28px;
                gap: 26px;
                border-radius: 20px;
                width: calc(100% - 32px);
            }

            .card-title { font-size: 26px; }

            .logo-wrap {
                width: 80px;
                height: 80px;
                border-radius: 18px;
            }

            .logo-wrap img {
                width: 48px;
                height: 48px;
            }
        }
    </style>
</head>

<body>

    <div class="floor"></div>

    <!-- Back -->
    <a class="back" href="/">
        <svg viewBox="0 0 24 24">
            <polyline points="15 18 9 12 15 6"/>
        </svg>
        Back
    </a>

    <!-- Card -->
    <div class="card">

        <div class="dl-counter" id="dlCounter">
            <svg viewBox="0 0 24 24" style="width:14px;height:14px;fill:currentColor;flex-shrink:0"><path d="M19 9h-4V3H9v6H5l7 7 7-7zm-14 9v2h14v-2H5z"/></svg>
            <span id="dlCount">—</span>
        </div>

        <div class="logo-wrap">
            <img src="/assets/Yex.png" alt="Yex Executor">
        </div>

        <div>
            <div class="card-title">Yex Executor</div>
            <div class="card-sub">Windows · Free</div>
        </div>

        <a
            class="dl-btn"
            href="https://github.com/YesD3v/yesd3v.github.io/releases/download/release/Yex.exe"
            download="Yex.exe"
        >
            <svg viewBox="0 0 24 24">
                <path d="M19 9h-4V3H9v6H5l7 7 7-7zm-14 9v2h14v-2H5z"/>
            </svg>
            Download
        </a>

        <div class="meta">Yex.exe</div>

    </div>

    <script>
        (async function () {
            try {
                const res = await fetch(
                    "https://api.github.com/repos/YesD3v/yesd3v.github.io/releases/tags/release",
                    { headers: { Accept: "application/vnd.github+json" } }
                );
                if (!res.ok) throw new Error();
                const data = await res.json();
                const asset = (data.assets || []).find(a => a.name === "Yex.exe");
                const count = asset ? asset.download_count : 0;
                document.getElementById("dlCount").textContent =
                    new Intl.NumberFormat("en").format(count);
            } catch {
                document.getElementById("dlCounter").style.display = "none";
            }
        })();
    </script>

</body>
</html>
