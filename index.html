<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YESHUB</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --discord: #5865F2;
            --scriptblox: #fff;
            --bg: #000;
            --panel: #080808;
            --border: rgba(255, 255, 255, 0.09);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 255, 255, 0.055),
                    transparent 38%
                ),
                #000;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.27;
            background:
                linear-gradient(
                    135deg,
                    transparent 47%,
                    rgba(255,255,255,.025) 49%,
                    transparent 51%
                ),
                linear-gradient(
                    45deg,
                    transparent 47%,
                    rgba(255,255,255,.018) 49%,
                    transparent 51%
                );
            background-size: 130px 130px;
            transform: perspective(800px) rotateX(55deg) scale(1.7);
            transform-origin: center bottom;
        }

        .floor {
            position: fixed;
            left: -10%;
            right: -10%;
            bottom: -35%;
            height: 75%;
            z-index: -1;
            opacity: 0.16;
            transform: perspective(500px) rotateX(62deg);

            background:
                linear-gradient(
                    rgba(255,255,255,.04) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.04) 1px,
                    transparent 1px
                );

            background-size: 80px 80px;

            mask-image: linear-gradient(
                to top,
                #000,
                transparent
            );

            -webkit-mask-image: linear-gradient(
                to top,
                #000,
                transparent
            );
        }

        /* Social buttons */

        .socials {
            position: fixed;
            top: 28px;
            right: 30px;
            z-index: 1000;

            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social {
            width: 48px;
            height: 48px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-decoration: none;

            background: rgba(8, 8, 8, 0.88);
            border: 1px solid rgba(255,255,255,.10);
            border-radius: 13px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow:
                0 8px 30px rgba(0,0,0,.5);

            transition:
                color .2s ease,
                border-color .2s ease,
                box-shadow .2s ease,
                background .2s ease,
                transform .2s ease;
        }

        .social svg {
            width: 25px;
            height: 25px;
            fill: currentColor;
        }

        .discord {
            color: var(--discord);
            border-color: rgba(88,101,242,.25);
        }

        .discord:hover {
            color: #7289DA;
            background: rgba(88,101,242,.08);
            border-color: rgba(88,101,242,.55);

            box-shadow:
                0 0 8px rgba(88,101,242,.25),
                0 0 24px rgba(88,101,242,.18),
                0 12px 35px rgba(0,0,0,.65);

            transform: translateY(-2px);
        }

        .scriptblox {
            color: #fff;
        }

        .scriptblox:hover {
            background: rgba(255,255,255,.07);
            border-color: rgba(255,255,255,.28);

            box-shadow:
                0 0 12px rgba(255,255,255,.10),
                0 12px 35px rgba(0,0,0,.65);

            transform: translateY(-2px);
        }

        /* Main */

        .container {
            width: min(1200px, calc(100% - 48px));
            margin: auto;
            padding: 55px 0 100px;
        }

        .brand {
            text-align: center;
            user-select: none;
        }

        .brand h1 {
            display: inline-block;

            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: .18em;

            transform: scaleX(1.12);
            transform-origin: center;

            color: #fff;

            text-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 14px rgba(255,255,255,.55),
                0 0 30px rgba(255,255,255,.28),
                0 0 60px rgba(255,255,255,.12);
        }

        .divider {
            width: 100%;
            height: 1px;
            margin-top: 38px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.20) 15%,
                rgba(255,255,255,.45) 50%,
                rgba(255,255,255,.20) 85%,
                transparent
            );

            box-shadow:
                0 0 15px rgba(255,255,255,.07);
        }

        /* Navigation */

        .navigation {
            margin-top: 35px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
        }

        .nav-card {
            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 90px;
            padding: 22px 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;

            border: 1px solid rgba(255,255,255,.10);
            border-radius: 16px;

            color: #fff;
            text-decoration: none;

            box-shadow:
                inset 0 1px rgba(255,255,255,.025),
                0 20px 60px rgba(0,0,0,.4);

            transition:
                border-color .25s ease,
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }

        .nav-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 1px;

            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.16),
                transparent
            );
        }

        .nav-card:hover {
            transform: translateY(-3px);
            border-color: rgba(255,255,255,.18);

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.06),
                    rgba(255,255,255,.015) 50%,
                    rgba(0,0,0,.4)
                ),
                #070707;

            box-shadow:
                inset 0 1px rgba(255,255,255,.04),
                0 25px 70px rgba(0,0,0,.5);
        }

        .nav-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .nav-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .01em;
        }

        .nav-subtitle {
            color: #666;
            font-size: 12px;
        }

        .nav-arrow {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 38px;
            height: 38px;

            border: 1px solid rgba(255,255,255,.09);
            border-radius: 9px;

            background: #101010;
            color: #888;

            transition:
                color .2s ease,
                border-color .2s ease,
                background .2s ease;
        }

        .nav-card:hover .nav-arrow {
            color: #fff;
            border-color: rgba(255,255,255,.20);
            background: #181818;
        }

        .nav-arrow svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* Info */

        .info-box {
            margin-top: 24px;
            padding: 24px 26px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.008) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;

            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;

            box-shadow:
                inset 0 1px rgba(255,255,255,.025),
                0 20px 60px rgba(0,0,0,.35);
        }

        .info-title {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .info-text {
            color: #666;
            font-size: 12px;
            line-height: 1.7;
        }

        .footer {
            margin-top: 35px;
            text-align: center;
            color: #444;
            font-size: 11px;
        }

        /* Mobile */

        @media (max-width: 600px) {
            body {
                padding-top: 0;
            }

            .socials {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;

                width: 100%;
                height: 70px;

                padding: 12px 14px;

                justify-content: flex-end;

                background: rgba(0,0,0,.88);
                border-bottom: 1px solid rgba(255,255,255,.07);

                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);

                box-shadow: 0 10px 35px rgba(0,0,0,.45);
            }

            .social {
                width: 44px;
                height: 44px;
                border-radius: 11px;
            }

            .social svg {
                width: 23px;
                height: 23px;
            }

            .container {
                width: calc(100% - 28px);
                padding-top: 105px;
                padding-bottom: 70px;
            }

            .brand h1 {
                font-size: clamp(3rem, 16vw, 5rem);
                letter-spacing: .1em;
                transform: scaleX(1.05);
            }

            .divider {
                margin-top: 25px;
            }

            .navigation {
                margin-top: 28px;
            }

            .nav-card {
                min-height: 82px;
                padding: 19px;
            }

            .nav-title {
                font-size: 16px;
            }

            .info-box {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="floor"></div>

    <!-- Social Links -->
    <div class="socials">

        <!-- Discord -->
        <a

    </div>

    <main class="container">

        <header class="brand">

        </header>

        <div class="divider"></div>

        <!-- Roblox -->
        <section class="navigation">

            <a class="nav-card" href="./rblx/">
                <div class="nav-info">
                    <div class="nav-title">Roblox</div>
                    <div class="nav-subtitle">

                    </div>

            <div class="info-title">YesDev</div>
            <div class="info-text">
                Personal projects, scripts and other work by yes.dev.
            </div>
        </section>

        <div class="footer">
            by yes.dev
        </div>

    </main>

</body>
</html>
