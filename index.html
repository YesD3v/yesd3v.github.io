<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/assets/YesHub.png">
    <link rel="shortcut icon" type="image/png" href="/assets/YesHub.png">

    <!-- Discord / OG embed -->

    <meta property="og:url"          content="https://yesd3v.github.io">
    <meta property="og:title"        content="YesHub">

    <meta property="og:image"        content="https://yesd3v.github.io/assets/YesHub.png">
    <meta property="og:image:width"  content="512">
    <meta property="og:image:height" content="512">

    <!-- Twitter card -->
    <meta name="twitter:card"        content="summary">
    <meta name="twitter:title"       content="YesHub">
    <meta name="twitter:description" content="Scripts, tools &amp; executors by yes.dev">
    <meta name="twitter:image"       content="https://yesd3v.github.io/assets/YesHub.png">

    <meta name="description" content="Scripts, tools &amp; executors by yes.dev">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --discord: #5865F2;
            --scriptblox: #8b5cf6;
            --bg: #000;
            --panel: #080808;
            --border: rgba(255, 255, 255, 0.09);
        }

        html {
            width: 100%;
            scroll-behavior: smooth;
            overflow-y: scroll;
            scrollbar-width: none;
        }

        html::-webkit-scrollbar {
            display: none;
        }

        body {
            width: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -3;
            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(255, 255, 255, 0.055),
                    transparent 38%
                ),
                #000;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -2;
            pointer-events: none;
            opacity: 0.38;
            background:
                linear-gradient(
                    135deg,
                    transparent 47%,
                    rgba(255,255,255,.025) 49%,
                    transparent 51%
                ),
                linear-gradient(
                    45deg,
                    transparent 47%,
                    rgba(255,255,255,.018) 49%,
                    transparent 51%
                );
            background-size: 130px 130px;
            transform: perspective(800px) rotateX(55deg) scale(1.7);
            transform-origin: center bottom;
        }

        .floor {
            position: fixed;
            left: -10%;
            right: -10%;
            bottom: -35%;
            height: 75%;
            z-index: -1;
            opacity: 0.34;
            pointer-events: none;
            transform: perspective(500px) rotateX(62deg);
            background:
                linear-gradient(rgba(255,255,255,.105) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.105) 1px, transparent 1px);
            background-size: 80px 80px;
            mask-image: linear-gradient(to top, #000, transparent);
            -webkit-mask-image: linear-gradient(to top, #000, transparent);
        }

        #custom-scrollbar {
            position: fixed;
            right: 5px;
            top: 8px;
            width: 5px;
            height: calc(100% - 16px);
            z-index: 9999;
            pointer-events: none;
        }

        #custom-scrollbar-thumb {
            position: absolute;
            left: 0;
            right: 0;
            border-radius: 999px;
            background: rgba(255,255,255,.13);
            opacity: 0;
            transition: opacity .3s ease;
            min-height: 28px;
        }

        #custom-scrollbar.scrolling #custom-scrollbar-thumb {
            opacity: 1;
        }

        .container {
            width: min(1200px, calc(100% - 48px));
            min-height: 100vh;
            margin: auto;
            padding: 55px 0 60px;
        }

        .brand {
            text-align: center;
            user-select: none;
        }

        .brand h1 {
            display: inline-block;
            font-size: clamp(3.5rem, 10vw, 8rem);
            line-height: 1;
            font-weight: 900;
            letter-spacing: .18em;
            transform: scaleX(1.12);
            transform-origin: center;
            color: #fff;
            text-shadow:
                0 0 5px rgba(255,255,255,.95),
                0 0 14px rgba(255,255,255,.55),
                0 0 30px rgba(255,255,255,.28),
                0 0 60px rgba(255,255,255,.12);
        }

        .divider {
            width: 100%;
            height: 1px;
            margin-top: 38px;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,.20) 15%,
                rgba(255,255,255,.45) 50%,
                rgba(255,255,255,.20) 85%,
                transparent
            );
            box-shadow: 0 0 15px rgba(255,255,255,.07);
        }

        /* ── Community Cards ─────────────────────────────────────── */

        .community-links {
            margin-top: 35px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
        }

        .community-card {
            min-height: 112px;
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 25px 27px;
            color: #fff;
            text-decoration: none;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.045),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            border-radius: 16px;
            box-shadow:
                inset 0 1px rgba(255,255,255,.025),
                0 20px 60px rgba(0,0,0,.4);
            transition:
                border-color .25s ease,
                transform .25s ease,
                box-shadow .25s ease,
                background .25s ease;
        }

        .community-card:hover {
            transform: translateY(-3px);
        }

        .community-card.discord-card {
            border: 1px solid rgba(88, 101, 242, .30);
        }

        .community-card.discord-card:hover {
            border-color: rgba(88, 101, 242, .65);
            background:
                linear-gradient(
                    145deg,
                    rgba(88,101,242,.075),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            box-shadow:
                inset 0 1px rgba(255,255,255,.035),
                0 0 20px rgba(88,101,242,.10),
                0 25px 70px rgba(0,0,0,.5);
        }

        .community-card.scriptblox-card {
            border: 1px solid rgba(139, 92, 246, .30);
        }

        .community-card.scriptblox-card:hover {
            border-color: rgba(139, 92, 246, .65);
            background:
                linear-gradient(
                    145deg,
                    rgba(139,92,246,.075),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            box-shadow:
                inset 0 1px rgba(255,255,255,.035),
                0 0 20px rgba(139,92,246,.10),
                0 25px 70px rgba(0,0,0,.5);
        }

        .community-card.github-card {
            border: 1px solid rgba(255, 255, 255, .16);
        }

        .community-card.github-card:hover {
            border-color: rgba(255, 255, 255, .35);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            box-shadow:
                inset 0 1px rgba(255,255,255,.035),
                0 0 20px rgba(255,255,255,.09),
                0 25px 70px rgba(0,0,0,.5);
        }

        /* Yex card — white accent to match the executor's clean branding */
        .community-card.yex-card {
            border: 1px solid rgba(255, 255, 255, .18);
        }

        .community-card.yex-card:hover {
            border-color: rgba(255, 255, 255, .42);
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.08),
                    rgba(255,255,255,.012) 50%,
                    rgba(0,0,0,.35)
                ),
                #070707;
            box-shadow:
                inset 0 1px rgba(255,255,255,.05),
                0 0 22px rgba(255,255,255,.08),
                0 25px 70px rgba(0,0,0,.5);
        }

        .community-icon {
            flex-shrink: 0;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            background: rgba(0,0,0,.38);
        }

        .discord-card .community-icon {
            color: var(--discord);
            border: 1px solid rgba(88,101,242,.20);
        }

        .discord-card .community-icon svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        .scriptblox-card .community-icon {
            border: 1px solid rgba(139,92,246,.20);
        }

        .scriptblox-card .community-icon img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .github-card .community-icon {
            border: 1px solid rgba(255,255,255,.20);
        }

        .github-card .community-icon svg {
            width: 30px;
            height: 30px;
            fill: #fff;
        }

        .yex-card .community-icon {
            border: 1px solid rgba(255,255,255,.18);
        }

        .yex-card .community-icon img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .community-info {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .community-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: .01em;
        }

        .community-subtitle {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
        }

        /* ── Action row (GitHub only now) ────────────────────────── */

        .action-links {
            margin-top: 28px;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 24px;
            align-items: stretch;
        }

        /* ── ScriptBlox Scripts ───────────────────────────────────── */

        .scriptblox-scripts {
            margin-top: 28px;
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: #999;
        }

        .scripts-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 20px;
        }

        .scripts-status {
            grid-column: 1 / -1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 34px 20px;
            text-align: center;
            color: #666;
            font-size: 12.5px;
            font-weight: 600;
            background:
                linear-gradient(145deg, rgba(255,255,255,.03), rgba(0,0,0,.35)),
                #070707;
            border: 1px solid var(--border);
            border-radius: 16px;
        }

        .scripts-status a {
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,.3);
        }

        .scripts-status a:hover {
            border-color: rgba(255,255,255,.7);
        }

        .script-card {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #fff;
            text-decoration: none;
            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.035),
                    rgba(255,255,255,.008) 45%,
                    rgba(0,0,0,.4)
                ),
                #070707;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow:
                inset 0 1px rgba(255,255,255,.025),
                0 20px 60px rgba(0,0,0,.35);
            transition:
                border-color .25s ease,
                transform .25s ease,
                box-shadow .25s ease;
        }

        .script-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139,92,246,.5);
            box-shadow:
                inset 0 1px rgba(255,255,255,.04),
                0 0 20px rgba(139,92,246,.12),
                0 25px 70px rgba(0,0,0,.5);
        }

        .script-thumb {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: linear-gradient(145deg, #0c0c0c, #060606);
            border-bottom: 1px solid rgba(255,255,255,.06);
            overflow: hidden;
        }

        .script-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .script-body {
            padding: 16px 18px 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .script-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .01em;
            line-height: 1.35;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .script-game {
            color: #888;
            font-size: 11.5px;
            font-weight: 600;
        }

        .script-stats {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 2px;
            color: #666;
            font-size: 11px;
            font-weight: 600;
        }

        .script-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .script-badge {
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(139,92,246,.12);
            border: 1px solid rgba(139,92,246,.30);
            color: #c4b5fd;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .02em;
        }

        .script-badge.patched {
            background: rgba(239,68,68,.12);
            border-color: rgba(239,68,68,.35);
            color: #fca5a5;
        }

        /* ── Mobile ───────────────────────────────────────────────── */

        @media (max-width: 800px) {
            #custom-scrollbar { display: none; }

            .community-links {
                grid-template-columns: 1fr;
            }

            .action-links {
                grid-template-columns: 1fr;
            }

            .scripts-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            .container {
                width: calc(100% - 28px);
                padding-top: 35px;
            }

            .brand h1 {
                letter-spacing: .1em;
                transform: scaleX(1.05);
            }

            .divider { margin-top: 25px; }

            .community-links {
                margin-top: 28px;
                gap: 16px;
            }

            .community-card {
                min-height: 0;
                padding: 18px;
                gap: 14px;
            }

            .community-icon {
                width: 48px;
                height: 48px;
                border-radius: 12px;
            }

            .discord-card .community-icon svg { width: 26px; height: 26px; }
            .scriptblox-card .community-icon img { width: 29px; height: 29px; }
            .github-card .community-icon svg { width: 24px; height: 24px; }
            .yex-card .community-icon img { width: 30px; height: 30px; }

            .community-title { font-size: 15px; }
            .community-subtitle { font-size: 11px; }

            .action-links {
                margin-top: 22px;
                gap: 16px;
            }

            .scriptblox-scripts { margin-top: 22px; }

            .scripts-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .script-card {
                flex-direction: row;
                align-items: stretch;
            }

            .script-thumb {
                width: 110px;
                min-width: 110px;
                aspect-ratio: unset;
                border-bottom: none;
                border-right: 1px solid rgba(255,255,255,.06);
            }

            .script-body {
                padding: 12px 14px;
                gap: 4px;
            }

            .script-title {
                font-size: 13px;
                -webkit-line-clamp: 3;
            }
        }

        @media (max-width: 380px) {
            .script-thumb {
                width: 90px;
                min-width: 90px;
            }
        }
    </style>
</head>

    <script>
        // ── Custom scrollbar ────────────────────────────────────────
        (function () {
            var bar   = document.getElementById("custom-scrollbar");
            var thumb = document.getElementById("custom-scrollbar-thumb");
            var scrollingTimer = null;

            function updateThumb() {
                var scrollTop    = window.scrollY || document.documentElement.scrollTop;
                var scrollHeight = document.documentElement.scrollHeight;
                var clientHeight = document.documentElement.clientHeight;
                var trackHeight  = bar.offsetHeight;

                if (scrollHeight <= clientHeight) {
                    bar.style.display = "none";
                    return;
                }

                bar.style.display = "";

                var thumbHeight = Math.max(28, (clientHeight / scrollHeight) * trackHeight);
                var maxTop      = trackHeight - thumbHeight;
                var thumbTop    = (scrollTop / (scrollHeight - clientHeight)) * maxTop;

                thumb.style.height = thumbHeight + "px";
                thumb.style.top    = thumbTop + "px";
            }

            window.addEventListener("scroll", function () {
                updateThumb();
                bar.classList.add("scrolling");
                clearTimeout(scrollingTimer);
                scrollingTimer = setTimeout(function () {
                    bar.classList.remove("scrolling");
                }, 600);
            }, { passive: true });

            window.addEventListener("resize", updateThumb, { passive: true });
            updateThumb();
        })();

        // ── ScriptBlox scripts ──────────────────────────────────────

        const SCRIPTBLOX_OWNER = "YesDev";
        const SCRIPTBLOX_PROFILE_URL = "https://scriptblox.com/u/YesDev";
        const SCRIPTBLOX_API_URL =
            "https://scriptblox.com/api/script/fetch?owner=" +
            encodeURIComponent(SCRIPTBLOX_OWNER) +
            "&max=20&sortBy=createdAt&order=desc";

        function formatCompactNumber(n) {
            if (typeof n !== "number" || isNaN(n)) return "0";
            return new Intl.NumberFormat("en", { notation: "compact", maximumFractionDigits: 1 }).format(n);
        }

        function timeAgo(dateStr) {
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return "";
            const seconds = Math.floor((Date.now() - date.getTime()) / 1000);
            const units = [
                ["year", 31536000], ["month", 2592000], ["week", 604800],
                ["day", 86400], ["hour", 3600], ["minute", 60],
            ];
            for (const [name, secs] of units) {
                const count = Math.floor(seconds / secs);
                if (count >= 1) return count + " " + name + (count > 1 ? "s" : "") + " ago";
            }
            return "just now";
        }

        function resolveImage(path, fallback) {
            const src = path || fallback;
            if (!src) return "";
            if (/^https?:\/\//i.test(src)) return src;
            return "https://scriptblox.com" + (src.startsWith("/") ? "" : "/") + src;
        }

        function escapeHTML(str) {
            const div = document.createElement("div");
            div.textContent = str == null ? "" : String(str);
            return div.innerHTML;
        }

        function renderScriptCard(script) {
            const title    = escapeHTML(script.title || "Untitled script");
            const gameName = escapeHTML((script.game && script.game.name) || "Universal");
            const thumb    = resolveImage(script.image, script.game && script.game.imageUrl);
            const url      = "https://scriptblox.com/script/" + encodeURIComponent(script.slug || "");
            const views    = formatCompactNumber(script.views || 0);
            const created  = script.createdAt ? timeAgo(script.createdAt) : "";

            const badges = [];
            if (script.verified)    badges.push({ label: "Verified", cls: "" });
            if (script.isUniversal) badges.push({ label: "Universal", cls: "" });
            if (script.key)         badges.push({ label: "Key System", cls: "" });
            if (script.isPatched)   badges.push({ label: "Patched", cls: "patched" });

            return (
                '<a class="script-card" href="' + url + '" target="_blank" rel="noopener noreferrer">' +
                    '<div class="script-thumb">' +
                        (thumb ? '<img src="' + thumb + '" alt="" loading="lazy" onerror="this.remove()">' : "") +
                    "</div>" +
                    '<div class="script-body">' +
                        '<div class="script-title">' + title + "</div>" +
                        '<div class="script-game">' + gameName + "</div>" +
                        '<div class="script-stats">' +
                            '<span>👁 ' + views + " views</span>" +
                            (created ? '<span>' + created + "</span>" : "") +
                        "</div>" +
                        (badges.length
                            ? '<div class="script-badges">' +
                              badges.map(b => '<span class="script-badge ' + b.cls + '">' + b.label + "</span>").join("") +
                              "</div>"
                            : "") +
                    "</div>" +
                "</a>"
            );
        }

        async function loadScriptBloxScripts() {
            const grid = document.getElementById("scriptsGrid");
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 10000);

            try {
                const res = await fetch(SCRIPTBLOX_API_URL, { signal: controller.signal });
                clearTimeout(timeoutId);

                if (res.status === 429) throw new Error("rate-limited");
                if (!res.ok) throw new Error("http-" + res.status);

                const data = await res.json();
                if (data && data.message) throw new Error(data.message);

                const scripts = (data && data.result && data.result.scripts) || [];

                if (!scripts.length) {
                    grid.innerHTML = '<div class="scripts-status">No scripts found on this account yet.</div>';
                    return;
                }

                grid.innerHTML = scripts.map(renderScriptCard).join("");
            } catch (err) {
                clearTimeout(timeoutId);

                const isRateLimited = (err && err.message === "rate-limited") || /rate/i.test((err && err.message) || "");
                const isAbort = err && err.name === "AbortError";

                const message = isRateLimited || isAbort
                    ? "ScriptBlox is rate-limiting requests right now."
                    : "Couldn't load scripts right now.";

                grid.innerHTML =
                    '<div class="scripts-status">⚠️ ' + message + "<br>" +
                    '<a href="' + SCRIPTBLOX_PROFILE_URL + '" target="_blank" rel="noopener noreferrer">View scripts on ScriptBlox ↗</a>' +
                    "</div>";
            }
        }

        loadScriptBloxScripts();
    </script>

</body>
